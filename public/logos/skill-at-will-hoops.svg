<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 108" role="img" aria-label="Skill At Will Hoops">
  <defs>
    <linearGradient id="saw-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="44%" stop-color="#d2d6dc"/>
      <stop offset="56%" stop-color="#8d949d"/>
      <stop offset="78%" stop-color="#c4c9d0"/>
      <stop offset="100%" stop-color="#f3f5f7"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="176" height="108" rx="15" fill="#151515"/>

  <!-- Skill At Will (chrome, dark outline) -->
  <text x="88" y="52" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-style="italic"
        font-size="27" letter-spacing="0.3"
        fill="url(#saw-chrome)" stroke="#23150c" stroke-width="0.9" paint-order="stroke">Skill At Will</text>

  <!-- SKILL AT WILL HOOPS (orange) -->
  <text x="88" y="72" text-anchor="middle"
        font-family="Arial,sans-serif" font-weight="800" font-size="11" letter-spacing="1.3"
        fill="#e8762a">SKILL AT WILL HOOPS</text>

  <!-- tagline -->
  <text x="88" y="89" text-anchor="middle"
        font-family="Arial,sans-serif" font-weight="700" font-size="8" letter-spacing="0.5"
        fill="#aeb4bc">#GrindOverMatter</text>
</svg>
