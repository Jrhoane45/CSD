<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Skill At Will Hoops">
  <defs>
    <linearGradient id="saw-txt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a3df0"/>
      <stop offset="55%" stop-color="#d62b6a"/>
      <stop offset="100%" stop-color="#e23b2e"/>
    </linearGradient>
    <radialGradient id="saw-ball" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f0954a"/>
      <stop offset="100%" stop-color="#d4691f"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="14" fill="#141414"/>

  <!-- basketball -->
  <g>
    <circle cx="50" cy="27" r="13" fill="url(#saw-ball)" stroke="#0d0d0d" stroke-width="1.3"/>
    <g stroke="#0d0d0d" stroke-width="1.1" fill="none">
      <line x1="37" y1="27" x2="63" y2="27"/>
      <line x1="50" y1="14" x2="50" y2="40"/>
      <path d="M40 16 Q50 27 40 38"/>
      <path d="M60 16 Q50 27 60 38"/>
    </g>
  </g>

  <text x="50" y="57" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-style="italic" font-size="15" fill="url(#saw-txt)">SKILL AT</text>
  <text x="50" y="74" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-style="italic" font-size="15" fill="url(#saw-txt)">WILL</text>
  <text x="50" y="89" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="8" letter-spacing="3" fill="#e7e1d3">HOOPS</text>
</svg>
